<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mythological Defense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container"></div>

<!-- Audio Controls -->
<div id="audio-controls">
    <button id="mute-btn" class="audio-btn" title="Toggle mute">🔊</button>
    <input type="range" id="volume-slider" class="audio-slider" min="0" max="100" value="50" title="Master Volume">
</div>

<!-- Game UI Overlay -->
<div id="game-ui">
    <!-- Top Bar -->
    <div id="top-bar">
        <!-- Left: Health -->
        <div id="health-section" class="ui-section">
            <div class="ui-label">HEALTH</div>
            <div class="health-container">
                <div id="health-bar" class="health-bar"></div>
                <div id="health-text" class="health-text">20/20</div>
            </div>
        </div>

        <!-- Gold Display -->
        <div id="gold-section" class="ui-section">
            <div class="ui-label">GOLD</div>
            <div class="gold-display">
                <svg class="gold-icon" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10" fill="#FFD700"/>
                    <path d="M12 6L15 12L12 18L9 12Z" fill="#FFA500"/>
                </svg>
                <span id="gold-count" class="gold-count">0</span>
            </div>
        </div>

        <!-- Center: Wave Info -->
        <div id="wave-section" class="ui-section">
            <div class="ui-label">WAVE</div>
            <div id="wave-number" class="wave-number">1/5</div>
            <div id="wave-status" class="wave-status">Enemies: 0</div>
        </div>

        <!-- Center-Right: Towers -->
        <div id="towers-section" class="ui-section">
            <div class="ui-label">TOWERS</div>
            <div id="towers-count" class="towers-count">0/6</div>
        </div>

        <!-- Speed Controls -->
        <div id="speed-section" class="ui-section">
            <div class="ui-label">SPEED</div>
            <div class="speed-controls">
                <button class="speed-btn" data-speed="0.5">0.5x</button>
                <button class="speed-btn active" data-speed="1">1x</button>
                <button class="speed-btn" data-speed="2">2x</button>
                <button class="speed-btn" data-speed="4">4x</button>
            </div>
        </div>

        <!-- Right: Pause Button -->
        <div id="controls-section" class="ui-section">
            <button id="pause-btn" class="pause-button" title="Press ESC to pause">
                <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                </svg>
                <span>PAUSE</span>
                <span class="keyboard-hint">ESC</span>
            </button>
        </div>
    </div>

    <!-- Bottom Tower Selection Panel -->
    <div id="tower-selection-panel">
        <div id="tower-selection-container">
            <div id="tower-list"></div>
        </div>
    </div>

    <!-- Tower Info Tooltip -->
    <div id="tower-info-tooltip" style="visibility: hidden; position: fixed; background: rgba(15,21,52,0.95); border: 2px solid #64d5ff; border-radius: 8px; padding: 12px; color: white; font-family: Arial; font-size: 12px; max-width: 200px; z-index: 10001; pointer-events: none; contain: layout style paint; will-change: transform;">
        <div id="tower-info-name" style="font-weight: bold; font-size: 14px; color: #64d5ff; margin-bottom: 8px;"></div>
        <div id="tower-info-stats" style="line-height: 1.6;">
            <div id="tower-info-level"></div>
            <div id="tower-info-damage"></div>
            <div id="tower-info-speed"></div>
            <div id="tower-info-range"></div>
            <div id="tower-info-upgrade" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #64d5ff; color: #FFD700;"></div>
        </div>
    </div>
</div>

<script src="phaser.js"></script>
<script type="module" src="src/game.js"></script>

</body>
</html>
